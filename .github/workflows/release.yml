name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing and provenance use the GitHub OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # On a release event, GITHUB_REF_NAME is the release tag, for example v0.2.0.
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # npm stage publish needs npm 11.21.0 or later.
      - name: Update npm
        run: npm install -g npm@latest

      # The trusted publisher on npmjs.com allows only staged publishing, so a
      # maintainer approves each version with 2FA before it is public.
      # prepack runs the build.
      - name: Stage the release on npm
        run: npm stage publish --provenance --access public
