name: Bug report
description: A showpiece command does not do what the docs say.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead? Include the error code (`E_*`) if there is one.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The full command that you ran.
      placeholder: npx showpiece capture --only home
    validations:
      required: true
  - type: input
    id: showpiece-version
    attributes:
      label: showpiece version
      description: The output of `npx showpiece --version`.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: The output of `node --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or emulator
      description: For example "Pixel_7_API_34 emulator" or "Pixel 8, Android 15". Not needed for `frame`.
  - type: dropdown
    id: app-type
    attributes:
      label: App type
      options:
        - Expo (dev client or debug build)
        - Expo (standalone APK)
        - Bare React Native
        - Other
  - type: textarea
    id: last-run
    attributes:
      label: last-run.json
      description: For a `capture` bug, paste `.showpiece/diagnostics/last-run.json`. Remove any private data first.
      render: json
